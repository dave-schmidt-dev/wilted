<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wilted · Core reliability prototype</title>
<style>
:root{color-scheme:dark;--bg:#101512;--panel:#18201b;--soft:#223027;--line:#344238;--ink:#edf1ed;--muted:#a8b5aa;--leaf:#83bd8d;--warn:#d9b76a;--bad:#df8c82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,input,select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#202a23;color:var(--ink)}button{cursor:pointer}button.primary{background:#4c8d59;border-color:#68a875}button:disabled{opacity:.55;cursor:default}button.danger{color:var(--bad)}button.active{background:var(--soft)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{padding:20px 12px;border-right:1px solid var(--line)}.brand{font-size:20px;font-weight:700;padding:0 8px 12px}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent}main{max-width:1000px;padding:28px 34px;width:100%;margin:0 auto;flex:1;min-height:0;overflow:auto}.shell{min-width:0;display:flex;flex-direction:column;height:100vh;max-height:100vh}h1,h2,p{margin:0}h1{font-size:28px}h2{font-size:17px}.muted,.meta{color:var(--muted)}.meta{font-size:13px}.card{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.row,.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row{padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border:0}.title{flex:1;min-width:140px}.title strong,.title span{display:block}.status{color:var(--muted);min-height:24px}.status.pending{color:var(--warn)}.status.error{color:var(--bad)}.status.success{color:var(--leaf)}.player{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px}.player.rail{margin-top:auto;border-radius:0;border-left:0;border-right:0;position:sticky;bottom:0}.player.rail{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px}.rail>strong,.rail>.meta,.rail>[data-play-status]{grid-column:1}.rail>.transport{grid-column:2;grid-row:1/4;align-self:center}.rail>.timeline{grid-column:1/-1}.rail>[data-speed-status]:empty{display:none}.player.side{width:330px;max-width:100%;margin:18px 0 18px auto}.player.full{margin:18px 0;min-height:280px;align-content:center}.player.phone{max-width:390px;margin:18px auto}.player.carplay{margin:18px 0;font-size:18px}.transport{display:flex;flex-wrap:wrap;gap:8px}.timeline{display:flex;align-items:center;gap:10px}.timeline input{min-width:0;flex:1;padding:0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:10px;background:var(--soft);border-radius:6px}.stat b{display:block}.fixture{margin:20px 34px;padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px}.fixture label{display:inline-flex;gap:8px;align-items:center;margin:4px}dialog{width:min(460px,calc(100% - 28px));border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:22px}dialog::backdrop{background:#0009}dialog p{margin:12px 0}.hidden{display:none}.phone-note{margin-top:8px;color:var(--muted)}
@media(max-width:650px){.app{display:block}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.brand{padding:0;font-size:18px}nav{display:flex;gap:4px}nav button{padding:7px 8px}.shell{height:calc(100vh - 66px);max-height:calc(100vh - 66px)}main{padding:22px 14px}.fixture{margin:16px 14px}.fixture label{display:flex;flex-wrap:wrap}.fixture select{max-width:100%}.player{padding:12px}.stats{grid-template-columns:1fr}.timeline{gap:6px}.row{align-items:flex-start}}
</style><body><div class="app"><aside><div class="brand">Wilted</div><nav><button data-page="larder">Larder</button><button data-page="feeds">Feeds</button><button data-page="settings">Settings</button></nav></aside><section class="shell"><main id="view"></main><div id="player-slot"></div><details class="fixture"><summary>Prototype scenarios · local fixtures only</summary><label>Scenario <select id="scenario"></select></label><label>Player layout <select id="surface"><option value="rail">Mac rail</option><option value="side">Mac side</option><option value="full">Mac full</option><option value="phone">Phone</option><option value="carplay">CarPlay</option></select></label><button data-action="pause">System Pause</button><p>No accounts, audio playback, native app, or cloud calls. Delays are simulated.</p></details></section></div><dialog id="confirm"></dialog>
<script>
const scenarios={
 'PLAY-IDLE':'First item from idle', 'PLAY-DELAY':'Delayed Play / Pause', 'PLAY-FAIL':'First-item backend refusal', 'PLAY-RETRY':'One route retry succeeds', 'PLAY-RETRY-FAIL':'Route retry fails', 'PLAY-MISSING':'Missing audio', 'PLAY-NOTREADY':'Audio not ready',
 'SPEED-FAIL':'Speed save fails', 'DELETE-ARTICLE':'Delete article', 'DELETE-FEED':'Unsubscribe feed', 'DELETE-FAIL':'Delete save fails',
 'ACCOUNT-UNBOUND':'Unbound library needs review', 'ACCOUNT-SWITCH':'Account changed', 'QUIT-SAVE':'Quit saves', 'QUIT-FAIL':'Quit save fails',
 'SYNC-WORKING':'Publisher working', 'SYNC-FAIL':'Publisher fails', 'SYNC-THROTTLE':'Publisher rate limited', 'PHONE-FETCH':'Phone fetch',
 'STATS':'Measured Mac totals', 'STATS-EMPTY':'No new measurements', 'STATS-LOAD':'Loading totals', 'STATS-FAIL':'Totals unavailable', 'CARPLAY':'CarPlay row selection'
};
const fixture={episodes:{'elm-001':{id:'elm-001',title:'Autumn Walk',feed:'Field Notes',duration:1680,checkpoint:848,date:'Sep 28, 2026'},'fern-006':{id:'fern-006',title:'Fern Line',feed:'Garden Radio',duration:1320,checkpoint:120,date:'Sep 20, 2026'}},article:{id:'article-001',title:'A quieter morning'},feed:{id:'feed-001',title:'Field Notes',subscribed:true},
 measurements:{playedSeconds:5640,receivedBytes:1240000000,manualSkipSeconds:960},
 stats:[['Audio processed','320 min'],['Speech generated','45 min'],['Confirmed ad time removed','38 min'],['Faster playback time saved','72 min'],['Played',null],['Downloaded',null],['Manually skipped',null]]};
fixture.stats[4][1]=fixture.measurements.playedSeconds/60+' min';fixture.stats[5][1]=(fixture.measurements.receivedBytes/1000000000).toFixed(2)+' GB';fixture.stats[6][1]=fixture.measurements.manualSkipSeconds/60+' min';
const state={scroll:{},page:'larder',surface:'rail',scenario:'PLAY-DELAY',item:'elm-001',position:848,phase:'paused',status:'Paused',errorType:null,token:0,pending:false,recoveryReady:false,mediaPending:false,attempts:0,retryCount:0,speed:1,savedSpeed:1,speedStatus:'',deleted:false,feedDeleted:false,deleteStatus:'',deleting:false,deleteAttempts:0,quitAttempts:0,account:'bound',review:false,publisher:'idle',syncStatus:'2 library changes waiting to send',phoneFetch:'Never',fetchPending:false,quitStatus:'',quitting:false,quitComplete:false,statsStatus:'ready',statsPending:false,carOutcome:'',carCallbacks:0,nowPlaying:false};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=x=>document.querySelector(x), sleep=ms=>new Promise(r=>setTimeout(r,ms));
function remember(){localStorage.setItem('wilted-core-prototype',JSON.stringify({page:state.page,scroll:state.scroll,surface:state.surface,speed:state.savedSpeed,item:state.item,position:state.position}));}
function configure(id){state.token++;fixture.episodes['elm-001'].checkpoint=848;fixture.episodes['fern-006'].checkpoint=120;Object.assign(state,{scenario:id,scroll:{},page:'larder',item:'elm-001',position:848,phase:'paused',status:'Paused',errorType:null,pending:false,recoveryReady:false,mediaPending:false,attempts:0,retryCount:0,speed:1,savedSpeed:1,speedStatus:'',deleted:false,feedDeleted:false,deleteStatus:'',deleting:false,deleteAttempts:0,quitAttempts:0,review:false,publisher:'idle',syncStatus:'2 library changes waiting to send',phoneFetch:'Never',fetchPending:false,quitStatus:'',quitting:false,quitComplete:false,statsStatus:'ready',statsPending:false,carOutcome:'',carCallbacks:0,nowPlaying:false});
 state.account=id==='ACCOUNT-UNBOUND'?'unbound':id==='ACCOUNT-SWITCH'?'quarantined':'bound';
 if(id.startsWith('DELETE'))state.page='feeds';if(id.startsWith('ACCOUNT')||id.startsWith('QUIT')||id.startsWith('SYNC')||id.startsWith('STATS')||id==='PHONE-FETCH'||id==='SPEED-FAIL')state.page='settings';
 if(state.account!=='bound')state.syncStatus=id==='ACCOUNT-UNBOUND'?'Review account before sending this library':'Account changed. Library changes are held for review';
 if(id==='SYNC-THROTTLE'){state.publisher='throttled';state.syncStatus='iCloud paused requests. Retry available in 2 min';}
 if(id==='STATS-EMPTY')state.statsStatus='empty';if(id==='STATS-LOAD')state.statsStatus='loading';if(id==='STATS-FAIL')state.statsStatus='error';if(id==='CARPLAY')state.surface='carplay';
 if(id==='PLAY-IDLE')state.position=0;$('#confirm').close();render();}
function controls(){return `<div class="transport">${['missingMedia','notReady'].includes(state.errorType)?'':`<button class="primary" data-action="primary" aria-label="${state.phase==='playing'?'Pause':'Play'}">${state.phase==='playing'?'Pause':'Play'}</button>`}${['missingMedia','notReady'].includes(state.errorType)?`<button data-action="resolve-media" ${state.mediaPending?'disabled':''}>${state.errorType==='missingMedia'?'Download audio':'Prepare audio'}</button>`:state.errorType?'<button data-action="retry">Retry playback</button>':''}</div>`;}
function player(){const e=fixture.episodes[state.item];return `<section class="player ${state.surface}" data-player data-fixture="${e.id}" data-surface="${state.surface}" data-phase="${state.phase}"><strong data-title>${esc(e.title)}</strong><span class="meta">${esc(e.feed)} · ${esc(e.date)}</span><div class="status ${state.pending?'pending':state.errorType?'error':''}" data-play-status role="status">${esc(state.status)}</div>${controls()}<div class="timeline"><span data-position>${Math.floor(state.position/60)}:${String(state.position%60).padStart(2,'0')}</span><input aria-label="Playback position" data-seek type="range" min="0" max="${e.duration}" value="${state.position}"><span>${Math.floor(e.duration/60)}:00</span></div><label>Speed <select data-speed><option value="1" ${state.speed===1?'selected':''}>1×</option><option value="1.5" ${state.speed===1.5?'selected':''}>1.5×</option><option value="2" ${state.speed===2?'selected':''}>2×</option></select></label><div class="status ${state.speedStatus.includes('failed')?'error':''}" data-speed-status>${esc(state.speedStatus)}</div>${state.speedStatus.includes('failed')?'<button data-action="retry-speed">Retry speed save</button>':''}${state.surface==='carplay'?`<button data-action="car-row">Select ${esc(e.title)}</button><p data-car-outcome data-car-result="${state.carOutcome}">${esc(({resumed:'Resumed',started:'Started',alreadyPlaying:'Already playing',failed:'Playback failed',superseded:'Selection replaced by a newer command'})[state.carOutcome]||'')}</p>${state.nowPlaying?'<p data-now-playing>Now Playing opened</p>':''}`:''}</section>`;}
function larder(){return `<h1>Larder</h1><section class="card"><h2>Ready</h2>${Object.values(fixture.episodes).filter(e=>e.id!==state.item).map(e=>`<div class="row" data-episode="${e.id}"><div class="title"><strong>${esc(e.title)}</strong><span class="meta">${esc(e.feed)} · ${Math.floor(e.duration/60)} min · ${esc(e.date)}</span></div><button data-select="${e.id}">Play</button></div>`).join('')}<p class="muted">The active episode appears in the player.</p></section>`;}
function feeds(){return `<h1>Feeds</h1><section class="card"><h2>Subscriptions</h2>${state.feedDeleted?'<p data-feed-removed>Unsubscribed. Downloads and listening history remain.</p>':`<div class="row" data-feed="feed-001"><strong class="title">${fixture.feed.title}</strong><button class="danger" data-delete="feed">Unsubscribe…</button></div>`}</section><section class="card"><h2>Articles</h2>${state.deleted?'<p data-article-removed>Article deleted.</p>':`<div class="row" data-article="article-001"><strong class="title">${fixture.article.title}</strong><button class="danger" data-delete="article">Delete…</button></div>`}<div data-delete-status class="status ${state.deleteStatus.includes('failed')?'error':''}">${esc(state.deleteStatus)}</div></section>`;}
function settings(){let stats=state.statsStatus==='ready'||state.statsStatus==='empty'?`<div class="stats">${fixture.stats.map(([label,value],i)=>`<div class="stat" data-stat="${i}">${label}<b>${state.statsStatus==='empty'&&i>3?(i===5?'0 GB':'0 min'):value}</b></div>`).join('')}</div><p class="meta" data-tracking>Played, downloaded and manually skipped tracked since Oct 3, 2026. Earlier history is not estimated. Downloaded uses decimal GB.</p>`:state.statsStatus==='loading'?`<p data-stats-state>Loading totals… Larder remains available.</p><button data-action="load-stats" ${state.statsPending?'disabled':''}>Load totals</button>`:'<p data-stats-state class="status error">Totals unavailable. Larder remains available.</p><button data-action="load-stats">Retry totals</button>';
 return `<h1>Settings</h1><section class="card"><h2>${state.surface==='phone'?'This phone':'Mac publisher'}</h2><div data-sync-status class="status ${state.publisher==='working'?'pending':state.publisher==='error'?'error':''}">${state.surface==='phone'?`Last successful fetch: ${state.phoneFetch}`:esc(state.syncStatus)}</div>${state.surface==='phone'?`<button data-action="fetch" ${state.fetchPending?'disabled':''}>${state.fetchPending?'Fetching…':'Fetch library'}</button><p class="phone-note">Fetch time reports this phone’s last successful library read.</p>`:`<button data-action="sync" ${state.account!=='bound'||state.publisher==='working'||state.publisher==='throttled'?'disabled':''}>Sync now</button>${state.account!=='bound'?'<button data-action="review">Review account…</button>':''}`}</section><section class="card"><h2>Lifetime totals · ${state.surface==='phone'?'this phone':'this Mac'}</h2>${state.surface==='phone'?'<p data-phone-stats>Phone listening: 12 min. Mac measurements stay on the Mac.</p>':stats}</section>${state.surface==='phone'?'':`<section class="card"><h2>Application</h2><button data-action="quit" ${state.quitting?'disabled':''}>Quit Wilted</button><p data-quit-status class="status ${state.quitting?'pending':state.quitStatus.includes('failed')?'error':''}">${esc(state.quitStatus)}</p></section>`}`;}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#view').innerHTML=state.page==='settings'?settings():state.page==='feeds'?feeds():larder();$('#player-slot').innerHTML=player();$('#scenario').value=state.scenario;$('#surface').value=state.surface;$('#view').scrollTop=state.scroll[state.page]||0;remember();}
async function transport(intent, item=state.item, recovery=false){if(intent==='primary'&&(state.pending||state.mediaPending))return 'coalesced';const token=++state.token;state.pending=true;state.errorType=null;if(intent==='pause'||(intent==='primary'&&state.phase==='playing')){state.phase='pausing';state.status='Pausing…';render();await sleep(650);if(token!==state.token)return 'superseded';state.phase='paused';state.pending=false;state.status='Paused';render();return 'paused';}
 if(state.item!==item){state.item=item;state.position=fixture.episodes[item].checkpoint;}state.phase='starting';state.status='Starting playback…';state.attempts++;render();await sleep(650);if(token!==state.token)return 'superseded';
 const scenario=state.scenario;if(!recovery&&!state.recoveryReady&&['PLAY-FAIL','PLAY-MISSING','PLAY-NOTREADY'].includes(scenario)){state.errorType=scenario==='PLAY-FAIL'?'backendRefusal':scenario==='PLAY-MISSING'?'missingMedia':'notReady';state.phase='paused';state.pending=false;state.status=scenario==='PLAY-FAIL'?'Playback refused. Your position is kept.':scenario==='PLAY-MISSING'?'Audio missing. Download it before playing.':'Audio is not ready. Finish preparation first.';render();return 'failed';}
 if(!recovery&&scenario.startsWith('PLAY-RETRY')){state.retryCount=1;state.attempts++;state.status='Audio route unavailable. Retrying once…';render();await sleep(650);if(token!==state.token)return 'superseded';if(scenario==='PLAY-RETRY-FAIL'){state.errorType='routeFault';state.phase='paused';state.pending=false;state.status='Audio route unavailable after one retry. Retry playback when ready.';render();return 'failed';}}
 state.phase='playing';state.pending=false;state.status='Playing';render();return state.position>0?'resumed':'started';}
async function saveSpeed(retry=false){const chosen=state.speed;state.speedStatus='Saving speed…';render();await sleep(650);if(state.speed!==chosen)return;if(state.scenario==='SPEED-FAIL'&&!retry)state.speedStatus='Speed save failed. Current speed '+chosen+'×; restart uses '+state.savedSpeed+'×.';else{state.savedSpeed=chosen;state.speedStatus='Speed saved';}render();}
function showDelete(kind){$('#confirm').innerHTML=`<h2>${kind==='feed'?'Unsubscribe Field Notes?':'Delete A quieter morning?'}</h2><p>${kind==='feed'?'Remove this subscription and its episode rows. Downloads and listening history remain on disk.':'Delete this article and queue its library removal together.'}</p><div class="tools"><button class="danger" data-confirm-delete="${kind}">Confirm ${kind==='feed'?'unsubscribe':'delete'}</button><button data-action="cancel-dialog">Cancel</button></div>`;$('#confirm').showModal();}
async function deleteItem(kind){if(state.deleting)return;state.deleting=true;state.deleteAttempts++;$('#confirm').close();state.deleteStatus='Saving removal…';render();await sleep(650);state.deleting=false;if(state.scenario==='DELETE-FAIL'&&state.deleteAttempts===1){state.deleteStatus='Removal save failed. Nothing was removed; retry is available.';}else{if(kind==='feed')state.feedDeleted=true;else state.deleted=true;state.deleteStatus='Removal saved';}render();}
function review(){state.review=true;$('#confirm').innerHTML='<h2>Review this library</h2><p data-review-context>'+ (state.account==='unbound'?'This existing library has no account binding.':'This library belongs to the previous account. Sending is paused.')+'</p><p>Keep it held, or deliberately allow this library for the reviewed account.</p><button data-action="approve-review">Use reviewed account</button> <button data-action="cancel-dialog">Keep held</button>';$('#confirm').showModal();}
async function sync(){if(state.account!=='bound'||['working','throttled'].includes(state.publisher))return;state.publisher='working';state.syncStatus='Sending 2 library changes…';render();await sleep(650);state.publisher=state.scenario==='SYNC-FAIL'?'error':'idle';state.syncStatus=state.publisher==='error'?'Send failed. 2 library changes kept for retry.':'Local changes sent at 10:15 AM. Phone fetch is separate.';render();}
async function quit(){if(state.quitting)return;state.quitting=true;state.token++;state.pending=false;state.phase='paused';state.status='Paused';state.quitAttempts++;state.quitStatus='Saving local position and pending library changes…';render();await sleep(650);state.quitting=false;state.quitComplete=state.scenario!=='QUIT-FAIL'||state.quitAttempts>1;state.quitStatus=state.quitComplete?'Saved. Prototype quit completed.':'Save failed. Quit cancelled; local work remains. Retry Quit Wilted.';render();}
async function carSelect(){if(state.pending)return;let outcome;if(state.phase==='playing')outcome='alreadyPlaying';else outcome=await transport('start');state.carCallbacks++;state.carOutcome=outcome;state.nowPlaying=['started','resumed','alreadyPlaying'].includes(outcome);render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.scroll[state.page]=$('#view').scrollTop;state.page=b.dataset.page;render();return;}if(b.dataset.select){transport('start',b.dataset.select);return;}if(b.dataset.delete){showDelete(b.dataset.delete);return;}if(b.dataset.confirmDelete){deleteItem(b.dataset.confirmDelete);return;}switch(b.dataset.action){case'primary':transport('primary');break;case'pause':transport('pause');break;case'resolve-media':if(state.mediaPending)return;state.mediaPending=true;state.status=state.errorType==='missingMedia'?'Downloading audio…':'Preparing audio…';render();sleep(650).then(()=>{state.mediaPending=false;state.recoveryReady=true;state.errorType=null;state.status='Audio ready. Play when ready.';render();});break;case'retry':transport('start',state.item,true);break;case'retry-speed':saveSpeed(true);break;case'cancel-dialog':$('#confirm').close();break;case'review':review();break;case'approve-review':state.account='bound';state.syncStatus='Account reviewed. 2 library changes waiting to send';$('#confirm').close();render();break;case'sync':sync();break;case'fetch':if(state.fetchPending)return;state.fetchPending=true;render();sleep(650).then(()=>{state.fetchPending=false;state.phoneFetch='Oct 3, 2026, 10:15 AM';render();});break;case'quit':quit();break;case'load-stats':if(state.statsPending)return;state.statsPending=true;state.statsStatus='loading';render();sleep(650).then(()=>{state.statsPending=false;state.statsStatus='ready';render();});break;case'car-row':carSelect();break;}});
document.addEventListener('change',e=>{if(e.target.id==='scenario')configure(e.target.value);if(e.target.id==='surface'){state.surface=e.target.value;render();}if(e.target.matches('[data-speed]')){state.speed=Number(e.target.value);saveSpeed();}if(e.target.matches('[data-seek]')){state.token++;state.pending=false;state.position=Number(e.target.value);fixture.episodes[state.item].checkpoint=state.position;state.phase='paused';state.status='Paused at selected position';render();}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();transport('primary');}});
$('#view').addEventListener('scroll',()=>{state.scroll[state.page]=$('#view').scrollTop;remember();});
$('#scenario').innerHTML=Object.entries(scenarios).map(([id,title])=>`<option value="${id}">${title}</option>`).join('');
try{Object.assign(state,JSON.parse(localStorage.getItem('wilted-core-prototype')||'{}'));state.savedSpeed=state.speed;}catch{}render();window.prototype={state,fixture,configure,transport};
</script></body></html>
