<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wilted — Feed settings</title>
  <style>
    :root {
      color-scheme: dark;
      --page:#0d110f; --card:#151b17; --raised:#1c241f; --line:#26332c;
      --ink:#ecf2ed; --muted:#92a398; --leaf:#7fd48c; --amber:#e8c468;
      --red:#f08585; --radius:9px;
    }
    * { box-sizing:border-box }
    body { margin:0; min-width:320px; background:var(--page); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    button,select,input { font:inherit; color:inherit }
    button,select,input[type=number] { border:1px solid var(--line); border-radius:6px; background:var(--raised); padding:7px 10px }
    button { cursor:pointer }
    button:hover { border-color:#52665a }
    button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--leaf); outline-offset:2px }
    .app { min-height:100vh; display:grid; grid-template-columns:218px minmax(0,1fr) }
    aside { display:flex; flex-direction:column; padding:22px 14px 14px; border-right:1px solid var(--line); background:#101512 }
    .brand { padding:0 10px 22px; font-size:18px; font-weight:650; letter-spacing:.01em }
    nav { display:grid; gap:3px }
    nav button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; color:var(--muted); text-align:left; padding:10px; border-radius:7px }
    nav button[aria-current=page] { background:#202b23; color:var(--ink) }
    nav .icon { width:18px; text-align:center; color:var(--leaf) }
    .aside-note { margin:auto 10px 0; color:var(--muted); font-size:12px }
    main { width:min(100%,1040px); margin:0 auto; padding:30px 34px 44px }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:22px; margin-bottom:20px }
    h1,h2,h3,p { margin-top:0 }
    h1 { margin-bottom:7px; font-size:25px; font-weight:620; letter-spacing:-.02em }
    h2 { margin-bottom:4px; font-size:16px; font-weight:620 }
    h3 { margin:0; font-size:15px; font-weight:620 }
    p { margin-bottom:0 }
    .sub,.muted { color:var(--muted) }
    .sub { max-width:670px; line-height:1.5 }
    .header-action { flex:none; align-self:center }
    .card { border:1px solid var(--line); border-radius:var(--radius); background:var(--card); padding:16px 18px; margin-top:16px }
    .card-head { display:flex; align-items:center; gap:12px; margin-bottom:8px }
    .card-head .count { margin-left:auto; color:var(--muted); font-size:12px }
    .defaults { display:flex; flex-wrap:wrap; gap:8px 22px; padding:11px 13px; border-radius:7px; background:#111713; color:var(--muted); font-size:12px }
    .defaults b { color:var(--ink); font-weight:550 }
    .feed-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:14px; align-items:center; padding:14px 0; border-top:1px solid var(--line) }
    .feed-row:first-of-type { border-top:0 }
    .feed-main { min-width:0 }
    .feed-name { display:block; font-weight:560; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
    .feed-url,.feed-capacity { display:block; margin-top:3px; font-size:12px; color:var(--muted) }
    .feed-capacity strong { color:var(--ink); font-weight:520 }
    .status { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; color:var(--muted); font-size:12px }
    .status.waiting { color:var(--amber) }
    .status-dot { width:7px; height:7px; border-radius:50%; background:currentColor }
    .gear { display:flex; align-items:center; justify-content:center; width:34px; height:34px; padding:0; font-size:17px }
    .feed-settings { margin:0 0 12px 0; padding:15px 17px 14px; border:1px solid #34443a; border-radius:8px; background:#111713; box-shadow:0 8px 20px #0003 }
    .popover-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px }
    .close { width:30px; height:30px; padding:0; color:var(--muted); background:transparent; font-size:18px }
    .settings-grid { display:grid; grid-template-columns:minmax(180px,.8fr) minmax(230px,1.2fr); gap:10px 18px; align-items:center }
    .field-label { font-weight:520 }
    .field-label small { display:block; margin-top:2px; color:var(--muted); font-size:11px; font-weight:400 }
    .field-control { display:flex; align-items:center; gap:8px; min-width:0 }
    .field-control select { min-width:190px; max-width:100% }
    .field-control input[type=number] { width:110px }
    .field-help { grid-column:1 / -1; min-height:17px; margin-top:-4px; color:var(--muted); font-size:11px }
    .resolved { display:grid; grid-template-columns:1fr auto; gap:5px 12px; margin-top:13px; padding:10px 12px; border-radius:7px; background:#19211b; font-size:12px }
    .resolved span { color:var(--muted) }
    .resolved b { font-weight:520; text-align:right }
    .capacity { margin-top:11px; padding:10px 12px; border:1px solid #51452b; border-radius:7px; background:#201d15; font-size:12px }
    .capacity strong { color:var(--amber); font-weight:600 }
    .waiting-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px }
    .episode-chip { display:inline-flex; padding:3px 8px; border-radius:99px; background:#302918; color:#e6d9b4; font-size:11px }
    .protected-note { margin-top:8px; color:var(--muted); font-size:11px }
    .popover-actions { display:flex; justify-content:flex-end; margin-top:12px }
    .primary { border-color:#517d58; background:#213b27 }
    .empty-state { padding:18px 0; color:var(--muted) }
    .larder-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0; border-top:1px solid var(--line) }
    .larder-row:first-of-type { border-top:0 }
    .pill { padding:3px 8px; border-radius:99px; background:#202b23; color:var(--leaf); font-size:11px }
    .notice { min-height:18px; margin-top:10px; color:var(--leaf); font-size:12px }
    .error { color:var(--red) }
    .hidden { display:none !important }
    @media(max-width:760px) {
      .app { grid-template-columns:1fr }
      aside { flex-direction:row; align-items:center; gap:12px; padding:10px 12px; border-right:0; border-bottom:1px solid var(--line) }
      .brand { padding:0; font-size:16px }
      nav { display:flex; flex:1; gap:4px }
      nav button { justify-content:center; width:auto; flex:1; padding:8px 6px }
      nav .icon { display:none }
      .aside-note { display:none }
      main { padding:22px 16px 34px }
      .page-head { flex-direction:column; gap:12px }
      .header-action { align-self:flex-start }
      .feed-row { grid-template-columns:minmax(0,1fr) auto; gap:8px 10px }
      .feed-row .status { grid-column:1; grid-row:2 }
      .feed-row .gear { grid-column:2; grid-row:1 / span 2 }
      .settings-grid { grid-template-columns:1fr; gap:5px }
      .field-control { margin-bottom:5px }
      .field-help { grid-column:1; margin:-4px 0 5px }
    }
    @media(max-width:420px) {
      .brand { display:none }
      main { padding-inline:12px }
      .card { padding:13px 12px }
      .defaults { display:grid; grid-template-columns:1fr 1fr; gap:8px }
      .resolved { grid-template-columns:1fr; gap:2px }
      .resolved b { text-align:left; margin-bottom:5px }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">Wilted</div>
      <nav aria-label="Main navigation">
        <button data-page="larder"><span class="icon" aria-hidden="true">▤</span>Larder</button>
        <button data-page="feeds" aria-current="page"><span class="icon" aria-hidden="true">◉</span>Feeds</button>
        <button data-page="settings"><span class="icon" aria-hidden="true">⚙</span>Settings</button>
      </nav>
      <p class="aside-note">Illustrative local prototype</p>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <script>
    // One canonical fixture per feed; the list, settings popover and capacity
    // state all render from these same records.
    const globalDefaults = {
      autoDownload: false,
      autoPrepare: true,
      prepareTiming: 'Immediately after download',
      keepLimit: null
    };
    const state = {
      page: 'feeds',
      openFeed: 'ai-daily',
      notice: '',
      feeds: [
        {
          id: 'field-notes', title: 'Field Notes', host: 'fieldnotes.example',
          keptEpisodes: [
            { id:'field-041', title:'Autumn Walk', state:'started' },
            { id:'field-040', title:'The River Path', state:'unstarted' },
            { id:'field-039', title:'First Frost', state:'unstarted' },
            { id:'field-038', title:'Evening Birds', state:'unstarted' }
          ],
          limitMode: 'global', limit: null,
          autoDownload: 'global', autoPrepare: 'global', waiting: []
        },
        {
          id: 'ai-daily', title: 'The AI Daily Brief', host: 'feeds.example',
          keptEpisodes: [
            { id:'ai-011', title:'Daily Brief 011', state:'playing' },
            { id:'ai-010', title:'Daily Brief 010', state:'started' },
            { id:'ai-009', title:'Daily Brief 009', state:'unstarted' }
          ],
          limitMode: 'custom', limit: 3,
          autoDownload: 'on', autoPrepare: 'global',
          waiting: ['The AI Daily Brief · Episode 014', 'The AI Daily Brief · Episode 013']
        },
        {
          id: 'garden-radio', title: 'Garden Radio', host: 'garden.example',
          keptEpisodes: [
            { id:'garden-023', title:'The Seed Archive', state:'started' },
            { id:'garden-022', title:'Moss and Stone', state:'unstarted' }
          ],
          limitMode: 'custom', limit: 8,
          autoDownload: 'off', autoPrepare: 'off', waiting: []
        }
      ]
    };
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value).replace(/[&<>"']/g, char => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[char]));
    const feedByID = id => state.feeds.find(feed => feed.id === id);
    const resolvedDownload = feed => feed.autoDownload === 'global'
      ? globalDefaults.autoDownload : feed.autoDownload === 'on';
    const resolvedPrepare = feed => feed.autoPrepare === 'global'
      ? globalDefaults.autoPrepare : feed.autoPrepare === 'on';
    const resolvedLimit = feed => feed.limitMode === 'global'
      ? globalDefaults.keepLimit : feed.limit == null ? undefined : feed.limit;
    const keptCount = feed => feed.keptEpisodes.length;
    const limitLabel = limit => limit === undefined ? 'Choose a number' : limit == null ? 'No limit' : `${limit} episodes`;

    function capacityText(feed) {
      const limit = resolvedLimit(feed);
      const count = keptCount(feed);
      if (limit === undefined) return `${count} kept · choose a limit`;
      if (limit == null) return `${count} kept · no limit`;
      if (count > limit) return `${count} kept · limit ${limit}; waiting for room`;
      if (count === limit && feed.waiting.length) {
        return `${count} of ${limit} kept · ${feed.waiting.length} waiting for room`;
      }
      return `${count} of ${limit} kept`;
    }

    function capacityPanel(feed) {
      const limit = resolvedLimit(feed);
      if (!feed.waiting.length) return '';
      const count = keptCount(feed);
      if (limit === undefined) return `<div class="capacity"><strong>Choose a limit to continue.</strong><div>The waiting episodes remain in Feeds until this setting is complete.</div></div>`;
      const atLimit = limit != null && count >= limit;
      const overLimit = limit != null && count > limit;
      const heading = overLimit
        ? `Already ${count} kept; this limit is ${limit}.`
        : atLimit
          ? `At limit · ${count} of ${limit} kept.`
          : limit == null ? 'No limit · waiting episodes can be kept.'
            : `${Math.max(0, limit - count)} place${limit - count === 1 ? '' : 's'} open.`;
      const explanation = overLimit
        ? 'No additional episode is automatically kept until the count falls below the limit.'
        : atLimit
          ? 'The next episodes wait here. When you make room, Wilted keeps the next one in feed order.'
          : 'The next episode will be kept automatically when it is eligible.';
      return `<div class="capacity" data-capacity-state="${overLimit ? 'over' : atLimit ? 'full' : 'open'}">
        <strong>${heading}</strong><div>${explanation}</div>
        <div class="waiting-list">${feed.waiting.map((episode, index) => `<span class="episode-chip" data-waiting-index="${index}">${esc(episode)}</span>`).join('')}</div>
        <p class="protected-note">Wilted never removes an existing, currently playing, or partly heard episode to create space.</p>
      </div>`;
    }

    function feedSettings(feed) {
      if (state.openFeed !== feed.id) return '';
      const customLimit = feed.limitMode === 'custom';
      const download = resolvedDownload(feed);
      const prepare = resolvedPrepare(feed);
      const limit = resolvedLimit(feed);
      return `<section class="feed-settings" role="dialog" aria-label="${esc(feed.title)} settings" data-settings-for="${feed.id}">
        <div class="popover-head"><h3>${esc(feed.title)} settings</h3><button class="close" data-close aria-label="Close feed settings">×</button></div>
        <div class="settings-grid">
          <div class="field-label">Automatic download<small>For episodes automatically kept in Larder</small></div>
          <div class="field-control"><select data-setting="autoDownload" aria-label="Automatic download for ${esc(feed.title)}">
            <option value="global" ${feed.autoDownload === 'global' ? 'selected' : ''}>Use global</option>
            <option value="on" ${feed.autoDownload === 'on' ? 'selected' : ''}>On</option>
            <option value="off" ${feed.autoDownload === 'off' ? 'selected' : ''}>Off</option>
          </select></div>
          <p class="field-help">Global default: ${globalDefaults.autoDownload ? 'On' : 'Off · manual'}. ${download ? 'This feed downloads automatically.' : 'Downloads stay manual for this feed.'}</p>

          <div class="field-label">Automatic preparation<small>After audio downloads</small></div>
          <div class="field-control"><select data-setting="autoPrepare" aria-label="Automatic preparation for ${esc(feed.title)}">
            <option value="global" ${feed.autoPrepare === 'global' ? 'selected' : ''}>Use global</option>
            <option value="on" ${feed.autoPrepare === 'on' ? 'selected' : ''}>On</option>
            <option value="off" ${feed.autoPrepare === 'off' ? 'selected' : ''}>Off</option>
          </select></div>
          <p class="field-help">Global default: ${globalDefaults.autoPrepare ? `On · ${esc(globalDefaults.prepareTiming)}` : 'Off · manual'}. ${prepare ? `This feed prepares using ${esc(globalDefaults.prepareTiming.toLowerCase())}.` : 'This feed waits for you to choose Prepare.'}</p>

          <div class="field-label">Episodes kept at once<small>Applies to this feed’s Larder entries</small></div>
          <div class="field-control"><select data-setting="limitMode" aria-label="Episode limit for ${esc(feed.title)}">
            <option value="global" ${!customLimit ? 'selected' : ''}>Use global · ${esc(limitLabel(globalDefaults.keepLimit))}</option>
            <option value="custom" ${customLimit ? 'selected' : ''}>Set a limit</option>
          </select>
          ${customLimit ? `<input type="number" min="1" step="1" inputmode="numeric" value="${feed.limit ?? ''}" placeholder="Episodes" data-setting="limit" aria-label="Number of episodes kept for ${esc(feed.title)}">` : ''}</div>
          <p class="field-help">Global default: ${esc(limitLabel(globalDefaults.keepLimit))}. A lower limit never removes episodes already in Larder.</p>
        </div>
        <div class="resolved" aria-live="polite" data-resolved>
          <span>Resolved now</span><b>${download ? 'Automatic download on' : 'Manual download'}</b>
          <span>Preparation</span><b>${prepare ? esc(globalDefaults.prepareTiming) : 'Manual'}</b>
          <span>Kept at once</span><b>${esc(limitLabel(limit))}</b>
        </div>
        ${capacityPanel(feed)}
        <div class="popover-actions"><button class="primary" data-close>Done</button></div>
      </section>`;
    }

    function feedsPage() {
      const rows = state.feeds.map(feed => {
        const limit = resolvedLimit(feed);
        const count = keptCount(feed);
        const atLimit = limit != null && count >= limit && feed.waiting.length > 0;
        const over = limit != null && count > limit;
        const status = limit === undefined ? 'Choose limit' : over ? 'Over limit' : atLimit ? 'Waiting for room' : `${count} kept`;
        return `<div class="feed-wrap" data-feed="${feed.id}">
          <div class="feed-row">
            <div class="feed-main"><span class="feed-name">${esc(feed.title)}</span><span class="feed-url">${esc(feed.host)}</span><span class="feed-capacity"><strong>${esc(capacityText(feed))}</strong></span></div>
            <span class="status ${atLimit || over ? 'waiting' : ''}" data-feed-status="${feed.id}"><i class="status-dot" aria-hidden="true"></i>${status}</span>
            <button class="gear" data-settings="${feed.id}" aria-label="Feed settings for ${esc(feed.title)}" aria-expanded="${state.openFeed === feed.id}">⚙</button>
          </div>
          ${feedSettings(feed)}
        </div>`;
      }).join('');
      return `<div class="page-head"><div><h1>Feeds</h1><p class="sub">New episodes are kept automatically up to each feed’s limit. When a feed is full, new episodes wait for room and move into Larder in feed order.</p></div><button class="header-action">Refresh</button></div>
        <section class="card" aria-label="Global automation defaults"><div class="card-head"><h2>Global defaults</h2><span class="count">Changed in Settings</span></div><div class="defaults"><span>Download <b>Manual</b></span><span>Prepare <b>Immediately</b></span><span>Kept per feed <b>No limit</b></span></div></section>
        <section class="card" aria-label="Subscriptions"><div class="card-head"><h2>Subscriptions</h2><span class="count">${state.feeds.length} feeds</span></div>${rows}<p class="notice" role="status">${esc(state.notice)}</p></section>`;
    }

    function larderPage() {
      const episodes = state.feeds.flatMap(feed => feed.keptEpisodes.map(episode => ({ ...episode, feed: feed.title })));
      return `<div class="page-head"><div><h1>Larder</h1><p class="sub">When you remove an unstarted episode, a waiting episode can take the open place. The limit never clears entries on its own.</p></div></div><section class="card"><div class="card-head"><h2>Episodes</h2><span class="count">${episodes.length} kept</span></div>${episodes.map(episode => `<div class="larder-row"><div><b>${esc(episode.title)}</b><div class="muted">${esc(episode.feed)}</div></div>${episode.state === 'playing' ? '<span class="pill">Playing · protected</span>' : episode.state === 'started' ? '<span class="pill">Partly heard · protected</span>' : `<button data-remove="${episode.id}">Remove from Larder</button>`}</div>`).join('')}</section><p class="notice" role="status">${esc(state.notice)}</p>`;
    }

    function settingsPage() {
      return `<div class="page-head"><div><h1>Settings</h1><p class="sub">Global automation defaults apply to feeds set to Use global.</p></div></div><section class="card"><div class="card-head"><h2>Automation</h2></div><div class="larder-row"><span>Automatic download</span><b>Manual</b></div><div class="larder-row"><span>Automatic preparation</span><b>Immediately after download</b></div><div class="larder-row"><span>Episodes kept per feed</span><b>No limit</b></div><p class="muted" style="margin-top:12px">Feed-specific settings are available from the gear beside each subscription.</p></section>`;
    }

    function render() {
      document.querySelectorAll('nav button').forEach(button => {
        if (button.dataset.page === state.page) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      $('#view').innerHTML = state.page === 'feeds' ? feedsPage() : state.page === 'larder' ? larderPage() : settingsPage();
    }

    function fillOpenPlaces(feed) {
      const limit = resolvedLimit(feed);
      if (limit === undefined || !feed.waiting.length) return [];
      const capacity = limit == null ? feed.waiting.length : Math.max(0, limit - keptCount(feed));
      const moved = feed.waiting.splice(0, capacity);
      for (const [index, title] of moved.entries()) {
        feed.keptEpisodes.push({ id:`${feed.id}-auto-${Date.now()}-${index}`, title, state:'unstarted' });
      }
      return moved;
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.page) { state.page = button.dataset.page; state.openFeed = null; render(); return; }
      if (button.dataset.settings) {
        state.openFeed = state.openFeed === button.dataset.settings ? null : button.dataset.settings;
        state.notice = '';
        render();
        return;
      }
      if (button.hasAttribute('data-close')) { state.openFeed = null; render(); return; }
      if (button.dataset.remove) {
        const feed = state.feeds.find(candidate => candidate.keptEpisodes.some(episode => episode.id === button.dataset.remove));
        if (!feed) return;
        const [removed] = feed.keptEpisodes.splice(feed.keptEpisodes.findIndex(episode => episode.id === button.dataset.remove), 1);
        const moved = fillOpenPlaces(feed);
        state.notice = moved.length
          ? `Removed ${removed.title}; ${moved[0]} was automatically kept in the open place.`
          : `Removed ${removed.title} from Larder.`;
        render();
        return;
      }
      if (button.classList.contains('header-action')) {
        state.notice = 'Feed refresh checks for new episode metadata.';
        render();
      }
    });

    document.addEventListener('change', event => {
      const control = event.target.closest('[data-setting]');
      if (!control || !state.openFeed) return;
      const feed = feedByID(state.openFeed);
      if (!feed) return;
      const setting = control.dataset.setting;
      if (setting === 'autoDownload' || setting === 'autoPrepare') feed[setting] = control.value;
      if (setting === 'limitMode') {
        feed.limitMode = control.value;
        if (feed.limitMode === 'global') feed.limit = null;
      }
      if (setting === 'limit') {
        const value = Number(control.value);
        if (!Number.isInteger(value) || value < 1) {
          state.notice = 'Enter a whole number of at least 1.';
          render();
          const input = $('[data-setting="limit"]');
          input?.focus();
          return;
        }
        feed.limit = value;
      }
      const moved = setting === 'limitMode' || setting === 'limit' ? fillOpenPlaces(feed) : [];
      state.notice = moved.length
        ? `${moved.length} waiting episode${moved.length === 1 ? '' : 's'} automatically moved into the available place${moved.length === 1 ? '' : 's'}.`
        : 'Feed settings updated in this prototype.';
      render();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && state.openFeed) { state.openFeed = null; render(); }
    });
    render();
  </script>
</body>
</html>
