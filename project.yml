name: Wilted

options:
  bundleIdPrefix: com.zerodelta.wilted
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  WiltedKit:
    path: WiltedKit
  WiltedProducer:
    path: Producer
  WiltedCloudKit:
    path: CloudSync
  WiltedListener:
    path: Listener

configs:
  Debug: debug
  Development: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.8"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  WiltedMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WiltedMac
      - path: Shared
        optional: true
    dependencies:
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedKit
        product: WiltedLibrary
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedCloudKit
        product: WiltedCloudKitLibrary
      - package: WiltedProducer
        product: WiltedProducer
    settings:
      base:
        # Source bundle ID; Apple App ID ownership and portal registration remain
        # separate attended evidence.
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.mac
        INFOPLIST_FILE: WiltedMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The leaf green is the app accent, so controls and sidebar labels
        # that never name a tint stop falling back to the system blue.
        # AccentColor.colorset carries WiltedTheme's wiltedLeaf pair.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Credential-free local signing keeps the Mac host launchable for
        # XCUITest without asserting a team, profile, entitlement, or
        # distributable identity. `-` is codesign's ad-hoc identity.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
      configs:
        Debug:
          # Ad-hoc ("-") cdhash changes on every rebuild, so the macOS
          # Documents-TCC grant for com.zerodelta.wilted.mac (pinned to a
          # bare cdhash csreq) invalidates and re-prompts every build. A
          # certificate-anchored designated requirement survives rebuilds.
          # Matches scripts/test-gate.sh's macos-ui-tests leg, which already
          # overrides to this identity/team on the command line -- this makes
          # an ordinary `xcodebuild`/Xcode Debug build stable too, not just
          # that one gate leg. Mirrors gradus/app/project.yml's GradusMac
          # Debug shape (Apple Development + explicit team, Manual style).
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        Development:
          CODE_SIGN_ENTITLEMENTS: WiltedMac/WiltedMac.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
        Release:
          CODE_SIGN_ENTITLEMENTS: WiltedMac/WiltedMacProduction.entitlements
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          ENABLE_HARDENED_RUNTIME: YES
          PROVISIONING_PROFILE_SPECIFIER: Wilted Developer ID
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
    info:
      path: WiltedMac/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Wilted
        CFBundleName: Wilted
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)

  WiltediOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WiltediOS
      - path: Shared
        optional: true
    dependencies:
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedKit
        product: WiltedLibrary
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedCloudKit
        product: WiltedCloudKitLibrary
      - package: WiltedListener
        product: WiltedListener
      # Built first, embedded in PlugIns/ by the script below (ordinary Siri requests, in the car too, are routed through it).
      - target: WiltediOSIntents
        embed: false
        link: false
      # Built first, copied into Watch/ by the script below (the companion Watch remote; Development only).
      - target: WiltedWatch
        embed: false
        link: false
    # Embedded by this script instead of Xcode's embed phase so Release can leave it out: Production has no
    # Siri entitlement (an App Store app with an Intents extension needs it) and no CarPlay entitlement, so
    # Release ships without the extension until Siri does.
    postBuildScripts:
      - name: Embed the Intents extension (not in Release)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$PLUGINS_FOLDER_PATH"
            rsync -a --delete "$BUILT_PRODUCTS_DIR/WiltediOSIntents.appex" "$TARGET_BUILD_DIR/$PLUGINS_FOLDER_PATH/"
          fi
      # The Watch app is a separate platform product, so it lands in its own products directory, not this one.
      # Release leaves it out, like the Intents extension: no Watch App ID or distribution profile exists yet.
      - name: Embed the Watch app (not in Release)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then
            case "$PLATFORM_NAME" in
              iphonesimulator) watch_platform=watchsimulator ;;
              *) watch_platform=watchos ;;
            esac
            watch_app="$(dirname "$BUILT_PRODUCTS_DIR")/$CONFIGURATION-$watch_platform/WiltedWatch.app"
            [ -d "$watch_app" ] || { echo "error: $watch_app was not built" >&2; exit 1; }
            mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Watch"
            rsync -a --delete "$watch_app" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Watch/"
          fi
    settings:
      base:
        # Source bundle ID; Apple App ID ownership and portal registration remain
        # separate attended evidence.
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios
        INFOPLIST_FILE: WiltediOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        Development:
          CODE_SIGN_ENTITLEMENTS: WiltediOS/WiltediOS.entitlements
          # CarPlay and Siri need a provisioning profile that carries com.apple.developer.carplay-audio and
          # com.apple.developer.siri (WILTED_SIRI asks for SiriKit authorization), so the
          # device build signs manually with it (Xcode cannot make that profile automatically).
          # The profile lists only this certificate; a second "Apple Development" identity in the
          # keychain would otherwise be picked and rejected.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: DAVID MICHAEL SCHMIDT (8Q6KTCFAD2)"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          PROVISIONING_PROFILE_SPECIFIER: Wilted iOS Development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE WILTED_SIRI"
        Release:
          CODE_SIGN_ENTITLEMENTS: WiltediOS/WiltediOSProduction.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          PROVISIONING_PROFILE_SPECIFIER: Wilted App Store
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
    info:
      path: WiltediOS/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Wilted
        CFBundleName: Wilted
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Wilted uses only Apple-provided HTTPS/CloudKit transport and SHA-256
        # integrity hashes; it does not implement non-exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        # Required by SiriKit authorization (INPreferences.requestSiriAuthorization), asked once on the phone.
        NSSiriUsageDescription: Wilted shares your episode titles with Siri so you can ask it to play your downloaded episodes by voice, including from CarPlay.
        # The intent the app answers itself (PlayMediaIntentHandler); in-app handling needs it declared here.
        INIntentsSupported:
          - INPlayMediaIntent
        INSupportedMediaCategories:
          - INMediaCategoryPodcasts
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - remote-notification
        # CarPlay scene (carplay-audio entitlement, docs/carplay-requirements.md). SwiftUI supplies the
        # iPhone window scene for the WindowGroup, so only the CarPlay role is declared here.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # The Siri Intents extension for spoken play requests ("Hey Siri", the car's Siri button). It resolves and confirms INPlayMediaIntent
  # and hands it to the app (.handleInApp); it plays nothing and shares no data with the app.
  WiltediOSIntents:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WiltediOSIntents
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios.intents
        INFOPLIST_FILE: WiltediOSIntents/Info.plist
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
        # Automatic, as asked (build with -allowProvisioningUpdates): Xcode creates and manages the
        # extension's App ID and profile; the app keeps its manual "Wilted iOS Development" profile.
        Development:
          CODE_SIGN_ENTITLEMENTS: WiltediOSIntents/WiltediOSIntents.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
        Release:
          CODE_SIGN_ENTITLEMENTS: WiltediOSIntents/WiltediOSIntentsProduction.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
    info:
      path: WiltediOSIntents/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Wilted Siri
        CFBundleName: WiltediOSIntents
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported:
              - INPlayMediaIntent
            SupportedMediaCategories:
              - INMediaCategoryPodcasts

  # The Apple Watch remote: shows now playing and Up Next from the phone and sends playback commands to it.
  # It plays nothing and keeps no library state; the iPhone stays the authority (W-INV-007 has no Watch record).
  WiltedWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WiltedWatch
      - path: WiltediOS/WatchLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios.watchkitapp
        INFOPLIST_FILE: WiltedWatch/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        # No icon yet: the placeholder catalog has none, and the default name would fail the build.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        # Automatic, like the Intents extension: Xcode creates the Watch App ID and profile (device builds
        # need -allowProvisioningUpdates); the iPhone app keeps its manual profile.
        Development:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
    info:
      path: WiltedWatch/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Wilted
        CFBundleName: WiltedWatch
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zerodelta.wilted.ios

  WiltedMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WiltedMacTests
        optional: true
    dependencies:
      - target: WiltedMac
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedKit
        product: WiltedLibrary
      - package: WiltedProducer
        product: WiltedProducer
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedCloudKit
        product: WiltedCloudKitLibrary
      - package: WiltedListener
        product: WiltedListener
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: WiltedMacTests.WiltedMacTestBundleObserver

  WiltediOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WiltediOSTests
        optional: true
      # The extension's handler is plain Intents code, so the tests compile it directly.
      - path: WiltediOSIntents/PlayMediaExtensionHandler.swift
    dependencies:
      - target: WiltediOS
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedKit
        product: WiltedLibrary
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedCloudKit
        product: WiltedCloudKitLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  WiltedMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WiltedMacUITests
    dependencies:
      - target: WiltedMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        # The UI runner must be ad-hoc signed independently of its host.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  WiltediOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WiltediOSUITests
    dependencies:
      - target: WiltediOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WiltedMac:
    build:
      targets:
        WiltedMac: all
    test:
      # XCTest records the whole screen by default. This project captures only
      # app-owned, window-scoped evidence, so keep system attachments off disk.
      captureScreenshotsAutomatically: false
      targets:
        - WiltedMacTests
        - WiltedMacUITests

  WiltediOS:
    build:
      targets:
        WiltediOS: all
    test:
      targets:
        - WiltediOSTests
        - WiltediOSUITests

  WiltedWatch:
    build:
      targets:
        WiltedWatch: all
