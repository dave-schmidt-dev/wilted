name: Wilted

options:
  bundleIdPrefix: com.zerodelta.wilted
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  WiltedKit:
    path: WiltedKit
  WiltedProducer:
    path: Producer
  WiltedCloudKit:
    path: CloudSync
  WiltedListener:
    path: Listener

configs:
  Debug: debug
  Development: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  WiltedMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WiltedMac
      - path: Shared
        optional: true
    dependencies:
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedProducer
        product: WiltedProducer
    settings:
      base:
        # Source bundle ID; Apple App ID ownership and portal registration remain
        # separate attended evidence.
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.mac
        INFOPLIST_FILE: WiltedMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Credential-free local signing keeps the Mac host launchable for
        # XCUITest without asserting a team, profile, entitlement, or
        # distributable identity. `-` is codesign's ad-hoc identity.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
      configs:
        Debug:
          # Ad-hoc ("-") cdhash changes on every rebuild, so the macOS
          # Documents-TCC grant for com.zerodelta.wilted.mac (pinned to a
          # bare cdhash csreq) invalidates and re-prompts every build. A
          # certificate-anchored designated requirement survives rebuilds.
          # Matches scripts/test-gate.sh's macos-ui-tests leg, which already
          # overrides to this identity/team on the command line -- this makes
          # an ordinary `xcodebuild`/Xcode Debug build stable too, not just
          # that one gate leg. Mirrors gradus/app/project.yml's GradusMac
          # Debug shape (Apple Development + explicit team, Manual style).
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        Development:
          CODE_SIGN_ENTITLEMENTS: WiltedMac/WiltedMac.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
        Release:
          CODE_SIGN_ENTITLEMENTS: WiltedMac/WiltedMacProduction.entitlements
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          ENABLE_HARDENED_RUNTIME: YES
          PROVISIONING_PROFILE_SPECIFIER: Wilted Developer ID
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
    info:
      path: WiltedMac/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Wilted
        CFBundleName: Wilted
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)

  WiltediOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WiltediOS
      - path: Shared
        optional: true
    dependencies:
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedListener
        product: WiltedListener
    settings:
      base:
        # Source bundle ID; Apple App ID ownership and portal registration remain
        # separate attended evidence.
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios
        INFOPLIST_FILE: WiltediOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        Development:
          CODE_SIGN_ENTITLEMENTS: WiltediOS/WiltediOS.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
        Release:
          CODE_SIGN_ENTITLEMENTS: WiltediOS/WiltediOSProduction.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: 4CJ49V6QHW
          PROVISIONING_PROFILE_SPECIFIER: Wilted App Store
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WILTED_CLOUDKIT_LIVE"
    info:
      path: WiltediOS/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Wilted
        CFBundleName: Wilted
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Wilted uses only Apple-provided HTTPS/CloudKit transport and SHA-256
        # integrity hashes; it does not implement non-exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  WiltedMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WiltedMacTests
        optional: true
    dependencies:
      - target: WiltedMac
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedProducer
        product: WiltedProducer
      - package: WiltedCloudKit
        product: WiltedCloudKit
      - package: WiltedListener
        product: WiltedListener
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.mac.tests
        GENERATE_INFOPLIST_FILE: YES

  WiltediOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WiltediOSTests
        optional: true
    dependencies:
      - target: WiltediOS
      - package: WiltedKit
        product: WiltedDomain
      - package: WiltedKit
        product: WiltedSync
      - package: WiltedCloudKit
        product: WiltedCloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  WiltedMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WiltedMacUITests
    dependencies:
      - target: WiltedMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        # The UI runner must be ad-hoc signed independently of its host.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  WiltediOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WiltediOSUITests
    dependencies:
      - target: WiltediOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.wilted.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WiltedMac:
    build:
      targets:
        WiltedMac: all
    test:
      # XCTest records the whole screen by default. This project captures only
      # app-owned, window-scoped evidence, so keep system attachments off disk.
      captureScreenshotsAutomatically: false
      targets:
        - WiltedMacTests
        - WiltedMacUITests

  WiltediOS:
    build:
      targets:
        WiltediOS: all
    test:
      targets:
        - WiltediOSTests
        - WiltediOSUITests
