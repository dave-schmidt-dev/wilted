<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ad Gold Review</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --border: #d1d1d6;
      --text: #1c1c1e;
      --text-muted: #636366;
      --accent: #0066cc;
      --low-conf-bg: #fff8e6;
      --low-conf-border: #e6a817;
      --selected-border: #0066cc;
      --highlight-word: #ffea79;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 { font-size: 18px; font-weight: 600; }
    #show-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    .show-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .show-item:hover:not(.disabled) { background: #f0f0f2; }
    .show-item.active { background: #e5e5ea; font-weight: 600; }
    .show-item.disabled {
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }
    .show-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .show-item-title { font-size: 14px; font-weight: 500; }
    .show-item-meta { font-size: 12px; color: var(--text-muted); }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: #e5e5ea;
      color: var(--text);
    }
    .badge-unreviewed { background: #e5e5ea; }
    .badge-in-progress { background: #d0e2ff; color: #0043ce; }
    .badge-confirmed { background: #defbe6; color: #0e6027; }
    .badge-needs-second { background: #fdd8d8; color: #9c0f0f; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 24px;
    }
    #empty-state {
      margin: auto;
      color: var(--text-muted);
      font-size: 16px;
    }
    #show-content { display: none; flex-direction: column; gap: 16px; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .show-titles h2 { font-size: 20px; font-weight: 600; }
    .show-titles h3 { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #save-status { font-size: 13px; color: var(--text-muted); min-width: 65px; }

    .player-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card-bg);
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    audio { flex: 1; height: 36px; }
    #audio-time { font-family: monospace; font-size: 14px; min-width: 70px; }

    .pattern-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pattern-row label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    #pattern-input {
      width: 100%;
      height: 60px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }

    .action-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #e5e5ea; }
    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    button.primary:hover { background: #0052a3; }

    #ranges-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }
    .range-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .range-row.selected {
      border: 2px solid var(--selected-border);
    }
    .range-row.low-confidence {
      background: var(--low-conf-bg);
      border-color: var(--low-conf-border);
    }
    .range-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .range-time { font-family: monospace; font-weight: 600; }
    #gaps-section h4 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--text-muted); }
    #gaps-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 30px; }
    .gap-row { display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .gap-row .range-time { min-width: 150px; }
    .range-note { color: var(--text-muted); font-size: 12px; font-style: italic; }
    .range-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .edge-line {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-muted);
      background: #fcfcfd;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px dashed var(--border);
    }
    .edge-label { font-weight: 600; margin-right: 6px; }
    .edge-word {
      display: inline-block;
      cursor: pointer;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .edge-word:hover { background: #d0e2ff; color: #000; }
    .edge-highlight {
      background: var(--highlight-word);
      color: #000;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Ad Gold Review</h1>
    </div>
    <ul id="show-list"></ul>
  </div>
  <div id="main">
    <div id="empty-state">Select a show to review</div>
    <div id="show-content">
      <div class="top-bar">
        <div class="show-titles">
          <h2 id="show-name"></h2>
          <h3 id="episode-title"></h3>
        </div>
        <div class="top-controls">
          <span id="show-status-badge" class="badge"></span>
          <span id="save-status">Saved</span>
          <button id="btn-confirm-rest" data-testid="btn-confirm-rest">Confirm rest of show</button>
          <button id="btn-second-ep" data-testid="btn-second-ep">Needs a second episode</button>
          <button id="btn-add-ad" data-testid="btn-add-ad" class="primary">Add ad here</button>
        </div>
      </div>
      <div class="player-row">
        <audio id="audio-player" controls preload="metadata"></audio>
        <span id="audio-time">0:00:00</span>
        <span class="range-note">Keys: Space play/pause, j/k next/previous, y confirm, n not an ad, e either way, s/d play start/end, [ / ] set start/end to playhead</span>
      </div>
      <div class="pattern-row">
        <label for="pattern-input">Show Ad Pattern</label>
        <textarea id="pattern-input" data-testid="pattern-input" placeholder="Pattern notes..."></textarea>
      </div>
      <div id="ranges-container"></div>
      <div id="gaps-section">
        <h4>Untranscribed stretches (music, or speech the transcript dropped; ad openings often hide here)</h4>
        <div id="gaps-container"></div>
      </div>
    </div>
  </div>
  <script src="/ad_gold_review.js"></script>
</body>
</html>
