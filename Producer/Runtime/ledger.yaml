  INV-1: {resolved_at_date: "2026-07-15", note: "Permanent daemon cutover removed Wilted's in-process TTS and retired _model_lock. The surviving optional in-process LLM lifecycle in classify, benchmark, and prepare is now routed through ModelCoordinator's single lease; production entry-path tests assert load, inference, and close all occur while the lease is held. The main-thread tqdm bootstrap clause remains covered. Gates: tests/test_classify.py, tests/test_prepare.py, tests/test_coordinator.py."}
  INV-4: {resolved_at_date: "2026-07-10", note: "Empty ad-cut/promo output can no longer overwrite a non-empty source: destructive shutil.move in prepare.py guarded on non-empty result, cut_ads raises EmptyCutResultError instead of touching a 0-byte file. Gate: tests/test_prepare.py::TestInv4NoEmptyOverwrite."}
  INV-2: {resolved_at_date: "2026-07-15", note: "The original negative gate locked load-close pairing, including close-on-exception. Permanent daemon cutover removed Wilted-process TTS residency; remaining optional LLM lifecycles in classify, benchmark, and prepare now use ModelCoordinator's single lease and exception-safe close. Speech models are daemon-resident outside the Wilted-process scope, with prepare evicting daemon STT before the LLM phase. Gates: tests/test_prepare.py::TestInv2LoadCloseAlwaysPaired, production lease tests in tests/test_classify.py and tests/test_prepare.py, and tests/test_coordinator.py."}
  INV-3: {resolved_at_date: "2026-07-10", note: "cli.py cmd_remove indexed a ready-only query (remove_article(index-1)) while the listing shows ready+selected, so the Nth displayed item was not the Nth removed item (wrong-article data loss, same class as the 2026-04-20 TUI fix, never migrated to CLI). Fixed to resolve the id from load_queue() then remove_article_by_id. Gate: tests/test_cli.py::TestCmdRemove::test_remove_targets_displayed_item_not_ready_only_index."}
  INV-5: {resolved_at_date: "2026-07-10", note: "prepare.py/download.py/cache.py bound DATA_DIR/AUDIO_DIR at import (from wilted import ...), so monkeypatch.setattr(wilted, DATA_DIR, ...) never reached them (M3 real-data leak — tests wrote into the real data/ tree). Fixed to live wilted.DATA_DIR/AUDIO_DIR attribute access at call time; a dead F401 alias retained in download.py/cache.py only as a monkeypatch target for unedited test/conftest fixtures. Gate: tests/test_prepare.py::TestInv5LiveDataDirResolution."}
  INV-6: {resolved_at_date: "2026-07-19", note: "cli.py defined main() but had no __main__ guard, so the nightly wrapper's `python -m wilted.cli` ran the module and exited 0 without invoking the pipeline (C1 — logged success nightly while doing nothing). Added `if __name__ == __main__: main()`. Gate: tests/test_cli.py::TestMainEntrypoint::test_run_module_invokes_main (hermetic runpy). Per-item isolation clause remains covered by tests/test_classify.py. A.4.2 extended INV-6 area to the weather-monitor module + its wrapper; wrapper truthful-run/exit gate added at tests/test_weather_monitor.py. Checkpoint advanced 2026-07-10 -> 2026-07-16 (Task 7.3): the 2026-07-11 A.4.2 wrapper-exit recurrence, the 2026-07-15 hermetic-E2E and nightly-wrapper recurrences, and the 2026-07-16 five-newest podcast-poll cap are each landed with passing gates under a green `make validate` (1,750). F5 (2026-07-17) removed the global main() daemon probe: non-speech CLI/management paths stay daemon-independent; TUI, play/next/direct export, and speech-capable runner drains call speech_ready.require_speech_ready() once at the speech boundary with probe=True. Gates: tests/test_cli.py::TestMainEntrypoint + TestRequireSpeechReady, tests/test_pipeline_handlers.py, tests/test_scheduler_tick.py. Real recurrences remain mapped (inv: INV-6); the marker-replay bug is tagged inv: NA as a weather-monitor area touch that did not breach the truthful-run/exit contract. Checkpoint advanced 2026-07-17 -> 2026-07-19 (Execution-Safety Consolidation A3): each of the six 2026-07-19 INV-6 recurrences is landed with a passing, sensitivity-verified gate (reverting the fix turns the named gate RED): evict-hint (tests/test_transcribe.py), per-feed discover isolation and discover ledger-exhaustion (tests/test_pipeline_handlers_stage52.py + the discover idempotency gate), '0 new items' misreport (tests/test_cli.py), _requeue_job attempt_count reset (tests/test_processing_jobs.py), and the retention prune-TOCTOU (processing_jobs.py prune_terminal_jobs) whose original gate was vacuous (green on the reverted fix) and was replaced with two revert-proven sensitive tests: tests/test_processing_jobs.py::test_prune_delete_reevaluates_state_at_delete_time (DELETE re-checks state at delete time, closing the select->requeue->delete window) and ::test_prune_deletes_candidate_set_larger_than_sqlite_variable_limit (bulk candidate set past the SQLite bound-variable limit). The checkpoint is deliberately NOT advanced past 2026-07-19: the two 2026-07-23 recurrences remain both visible and counted -- the empty/whitespace-extraction -> 'failed' truthfulness fix stays tagged inv: INV-6, and the CR-9 suppression-scope fix is retagged inv: INV-11 (a progress-visibility property, not an execution-truthfulness breach) -- so the freeze clears on landed, sensitivity-verified work rather than by erasing live recurrences from the count. make validate green (1,948)."}
  INV-7: {resolved_at_date: "2026-07-11", note: "Net-new invariant introduced born-covered in Plan A A.3.1 (StationController single-writer command queue, commit d65a59f) and A.3.2 CheckpointPoller (3e7c67e): the controller's single drain thread is the sole caller of reducer.apply, so every station mutation funnels through one command queue — preventing the lost-update/split-brain race two concurrent apply callers would cause. station_revision advances on every accepted mutation and only on accepted mutations, so accept-vs-reject is detectable by the revision delta and the CAS fencing token stays monotonic. Gate: tests/test_station_controller.py (single-writer serialization, reject-leaves-revision-unchanged, concurrent-enqueue no lost/duplicated apply)."}
  INV-8: {resolved_at_date: "2026-07-11", note: "Net-new invariant introduced in Plan A and enforced-complete in A.3.5 (commit ef0b015, finalized 1c10fcf): no code path other than the StationController writes station state — every mutation goes through submit() (compare-and-set on the pre-apply revision), never a direct store.persist_state/persist_checkpoint from a surface. TUI refactored to route all mutations through the controller; set_resume_position/get/clear fully retired for station entries. Gate: tests/test_station_controller.py + tests/test_tui.py::test_inv8_wilted_tui_source_never_references_legacy_resume_functions (AST scan proving the TUI source references no legacy direct-write resume/checkpoint functions)."}
  INV-9: {resolved_at_date: "2026-07-11", note: "Net-new invariant from a shipped silent failure: normalize.py built safe-interruption maps with _SAFE_INTERRUPTION_BAND_MS=0 (zero-width (start,start) windows), so safe_point_at(live_offset) — gated in both the TUI submitter and the reducer — could never be true for a continuously-advancing offset, and the weather bulletin NEVER interrupted real playback on David's Mac while the suite stayed green. Green because every bulletin test used SafeInterruptionMap.from_verified_windows() wide windows, never the production from_transcript_segments() (test-double divergence). Fixed at band=1000 (commit 9f26b9a); HAZARD 2 preserved (live offset still submitted/checkpointed). Gates: tests/test_item_normalize.py::test_normalize_safe_windows_have_tolerance_so_live_offset_can_match + tests/test_tui.py::test_bulletin_fires_with_production_built_safe_map_not_only_handcrafted_windows (band=0 negative control). Separately, launch-mode visibility (test-trigger vs live-NWS) made non-silent via WARNING logs + TUI TEST-TRIGGER ARMED line + make station-test (commit 89acc0a)."}
  INV-10: {resolved_at_date: "2026-07-16", note: "Born-covered in Task 5.4: AST scan rejects direct create_model_coordinator/create_backend/transcribe_audio calls outside pipeline_runner.py, handlers/*, execution_capability.py, and tests; runtime execution-capability gating remains authoritative in tests/test_execution_capability.py. Gate: tests/test_background_work_invariant.py."}
  INV-11: {resolved_at_date: "2026-07-24", note: "Retrofit of the standing global 'no silent blocking waits' invariant (AGENTS.md Progress Visibility) into wilted's charter, following the 2026-07-24 CLI on_status fix. Surface audit: cmd_add / cmd_direct(http) / cmd_play / cmd_next already surface progress; the multi-GB hf_hub GGUF download surfaces its own tqdm bar (suppression confined to the fetch cascade). Primary gap fixed: cmd_discover/classify/report/prepare printed only after the drain — added an on_status seam to drain_runner + a wait-naming opener in each run_*_via_runner, forwarded from the CLI to stderr; daemon path passes None and stays byte-silent (detail in the file log). Second-door sweep (advisor-prompted, universal wording): two more callers reached the same drain seam through the zero-arg discover.run_discover facade, which dropped the sink — the `feed add` follow-on chain (_maybe_chain_discover_prepare) ran discover+prepare silently, and onboard.run_ingest named each stage but went silent under the drain. Fixed by giving run_discover an on_status passthrough; the chain forwards _print_status. run_ingest is shared by the interactive wizard and the nightly `wilted ingest` daemon entry (scripts/wilted-nightly.sh), so it takes a caller-owned on_status (entry point owns the surface): run_setup passes a stderr heartbeat, the nightly path passes None so its per-run log is unchanged and drain-layer byte-silence holds. Classified-not-plumbed: cmd_feed add itself is a pure DB insert + string validation (no network); station playback/handoff is TUI-driven (launched only via WiltedApp.run(), progress -> TUI status region / Delta-0); wilted benchmark is a dev-only tool that already prints a wait-naming header + per-model result line. Born-covered gate: tests/test_progress_visibility.py (heartbeat-during-drain, daemon byte-silence, enumerated CLI sink-forwarding, feed-add-chain + onboarding second-door forwarding, the nightly-entry seam itself — cmd_ingest passes no sink so a future stderr heartbeat there can't silently regress nightly byte-silence, stderr-not-stdout channel hygiene, suppression-confinement + download-bar-not-disabled static guards). Known boundary: intra-batch granularity (one long job inside a single runner.run()) is coarse by design — a finer hook would cross into the coordinator internals INV-1/7/8/10 protect."}
  INV-12: {resolved_at_date: "2026-07-25", note: "Born-covered in M3 of the resource-aware smart processing queue. The claim seam now applies a pure, EXPENSIVE-only deferral filter so heavy local-model work is not claimed during the 08:00-20:00 local busy window when there is already sufficient listenable inventory, while structurally guaranteeing no interactive-priority (priority >= interactive_priority_floor, default 1) or aged-past-ceiling (>= max_defer_hours, 18h) job is ever starved. scheduling_policy.should_defer/select_claimable are pure over a once-sampled PolicyContext (availability + inventory + clock); the seam (_claim_next_job_under_lock_once) fetches ALL claimable rows in the base priority DESC, created_at ASC order (never a bounded LIMIT — candidate-set contract: None means nothing claimable globally) and claims the first non-deferred row. Filter-only: deferred jobs stay QUEUED (no DEFERRED write, no sweep — M4 out). Fail-open on an unavailable sensor (runs + one WARNING to the logger, INV-11), all thresholds get_setting-overridable at call time under the live DATA_DIR (INV-5). Adds ZERO concurrency: the per-DATA_DIR flock + CAS single-flight are untouched (INV-1/2/10). Gates: tests/test_scheduling_policy.py (45 unit tests: five-rule fire/no-fire boundaries, expensive-only, priority bypass, age-ceiling backstop, daytime 07:59/08:00/19:59/20:00 boundaries, machine-idle truth table, fail-open ordering, and the select_claimable global-None property) + tests/test_processing_jobs.py::TestClaimSeamDeferralPolicy (seam end-to-end: defer-stays-QUEUED, cheap-behind-deferred-claimed, sample-once, fail-open-runs-and-warns, and the spawn single-flight-with-policy guard). make validate green."}
