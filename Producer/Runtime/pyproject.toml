[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wilted"
version = "0.2.0"
description = "Local TTS article reader using Kokoro via mlx-audio on Apple Silicon"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "mlx-audio[tts]",
    # Kokoro English g2p — mlx-audio lazy-imports misaki/espeak but does NOT declare
    # them (the same gap speech-stack pins around). Without these, Kokoro TTS ImportErrors at
    # synthesis. Torch-free set matching pin set A (NOT misaki[en], whose extra pulls torch).
    "misaki==0.9.4",
    "spacy==3.8.14",
    "num2words==0.5.14",
    "phonemizer-fork==3.3.2",
    "espeakng-loader==0.2.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "parakeet-mlx",
    "speech-stack",
    "trafilatura",
    "numpy",
    "tqdm",
    "llama-cpp-python==0.3.34",
]

[project.optional-dependencies]
vlm = ["mlx-vlm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# pytest-textual-snapshot==1.1.0 hard-pins syrupy==4.8.0, which itself pins
# pytest<9.0.0 -- incompatible with this project's pytest>=9.0.2. syrupy
# dropped that pytest<9 ceiling starting in 5.0.0 without changing the
# internal API surface pytest-textual-snapshot actually uses (SnapshotAssertion
# .use_extension/.executions/.num_executions/._custom_index/._execution_name_index,
# SingleFileSnapshotExtension, WriteMode -- verified present and unchanged in
# syrupy 5.5.3). Overriding here is a targeted fix for that one dependency's
# stale pin, not a general syrupy-4-vs-5 API migration.
override-dependencies = ["syrupy>=5.0.0"]
no-binary-package = ["llama-cpp-python"]
extra-build-variables = { llama-cpp-python = { CMAKE_ARGS = "-DGGML_METAL=on" } }

# Speech-stack version authority (S-INV-4). Keep the installed speech-critical set
# aligned with the sibling speech-stack project. mlx, mlx-metal, mlx-lm and mlx-vlm
# are transitive or optional here; constraints pin them without adding runtime deps.
# Re-lock and rebuild the checkout-local runtime with `uv sync --locked`.
constraint-dependencies = [
    "mlx==0.32.4",
    "mlx-metal==0.32.4",
    "parakeet-mlx==0.5.2",
    "mlx-audio==0.6.7",
    "mlx-lm==0.31.3",
    "mlx-vlm==0.8.0",
    "numpy==2.4.4",
]

[tool.uv.sources]
# EDITABLE is required, not cosmetic: speech_stack.isolated.state_dir() resolves
# the shared GPU lock via Path(__file__).parents[2]/.state. A non-editable (copied)
# install would resolve the lock inside wilted's site-packages, breaking the
# cross-process "one GPU child at a time" guarantee (S-INV-3). Editable keeps
# __file__ pointing at the speech-stack source so the lock at
# `<speech-stack>/.state/gpu.lock` is genuinely shared.
# The path is relative to this file so the checkout works from any location
# and no developer's home directory is published to the repository.
speech-stack = { path = "../../../speech-stack", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests with mocked boundaries",
    "integration: multi-module tests using the real DB/filesystem or heavier wiring",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# vulture_allowlist.py is a machine-generated dead-code baseline made of bare
# names / `_.attr` stubs (vulture whitelist syntax). Those are unresolved
# names to ruff, so exclude the file to keep `make lint` (an F821 source) green.
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TCH"]

# Dead-code detection. `paths` includes the machine-generated allowlist so its
# stub references mark the known false-positive / dynamically-used surface as
# "used"; regenerate the baseline with `vulture src --make-whitelist`.
# min_confidence 60 is vulture's default — kept explicit as the gate contract.
[tool.vulture]
paths = ["src", "vulture_allowlist.py"]
min_confidence = 60

[dependency-groups]
dev = [
    "pygments>=2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0",
    "pytest-textual-snapshot==1.1.0",
    "ruff>=0.0.1",
    "vulture>=2.16",
]
