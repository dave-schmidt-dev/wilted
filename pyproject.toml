[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wilted"
version = "0.2.0"
description = "Local TTS article reader using Kokoro via mlx-audio on Apple Silicon"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "mlx-audio[tts]",
    # Kokoro English g2p — mlx-audio 0.4.5 lazy-imports misaki/espeak but does NOT declare
    # them (the same gap speech-stack pins around). Without these, Kokoro TTS ImportErrors at
    # synthesis. Torch-free set matching pin set A (NOT misaki[en], whose extra pulls torch).
    "misaki==0.9.4",
    "spacy==3.8.14",
    "num2words==0.5.14",
    "phonemizer-fork==3.3.2",
    "espeakng-loader==0.2.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "parakeet-mlx",
    "trafilatura",
    "numpy",
    "sounddevice",
    "peewee>=3.17",
    "feedparser>=6.0",
    "tqdm",
    "rich>=13.0",
    "playwright>=1.58.0",
    "textual>=8.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python==0.3.33"]
vlm = ["mlx-vlm"]

[project.scripts]
wilted = "wilted.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# pytest-textual-snapshot==1.1.0 hard-pins syrupy==4.8.0, which itself pins
# pytest<9.0.0 -- incompatible with this project's pytest>=9.0.2. syrupy
# dropped that pytest<9 ceiling starting in 5.0.0 without changing the
# internal API surface pytest-textual-snapshot actually uses (SnapshotAssertion
# .use_extension/.executions/.num_executions/._custom_index/._execution_name_index,
# SingleFileSnapshotExtension, WriteMode -- verified present and unchanged in
# syrupy 5.5.3). Overriding here is a targeted fix for that one dependency's
# stale pin, not a general syrupy-4-vs-5 API migration.
override-dependencies = ["syrupy>=5.0.0"]

# Speech-stack consolidation (Phase 4): converge the speech-critical packages on
# pin set A (the ~/.venvs/speech version authority, S-INV-4). mlx/mlx-metal/mlx-lm are
# transitive; constraints pin them without adding direct deps. Roll back = revert this
# block + rebuild the venv (`uv sync`).
constraint-dependencies = [
    "mlx==0.32.0",
    "mlx-metal==0.32.0",
    "parakeet-mlx==0.5.2",
    "mlx-audio==0.4.5",
    "mlx-lm==0.31.3",
    "mlx-vlm==0.6.4",
    "numpy==2.4.4",
]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-python-metal" }

[[tool.uv.index]]
name = "llama-cpp-python-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests with mocked boundaries",
    "integration: multi-module tests using the real DB/filesystem or heavier wiring",
    "e2e: subprocess CLI tests that exercise the real entrypoint",
    "tui: Textual pilot tests for the terminal UI",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TCH"]

[dependency-groups]
dev = [
    "pygments>=2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0",
    "pytest-textual-snapshot==1.1.0",
    "ruff>=0.0.1",
]
